name: Optimise homepage visuals without changing composition
on:
  push:
    branches: [workflow-5-stage]
    paths:
      - .github/workflows/optimise-homepage-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compress-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert existing approved photographs and real app capture to efficient WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          images={
            'images/demo/kitchen.jpg':'images/perf/hero-kitchen.webp',
            'images/demo/exterior.jpg':'images/perf/final-exterior.webp',
            'images/screen-hero.jpg':'images/perf/hero-phone.webp',
          }
          for source,dest in images.items():
              image=Image.open(source).convert('RGB')
              target=Path(dest)
              target.parent.mkdir(parents=True,exist_ok=True)
              image.save(target,'WEBP',quality=85,method=6)
              check=Image.open(target)
              assert check.size==image.size
              print(f'{source}: {Path(source).stat().st_size} -> {target.stat().st_size} bytes ({image.size})')
          PY
      - name: Publish compressed artwork only to isolated review branch
        run: |
          git config user.name "ScopeSnap optimisation bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f images/perf/
          git commit -m "Optimise approved homepage photo and real app screen file formats" -- images/perf/
          git push origin HEAD:refs/heads/workflow-5-stage
