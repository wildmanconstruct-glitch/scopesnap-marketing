name: Website visual QA
on:
  push:
    branches: [main, workflow-5-stage, workflow-polish-92]
    paths:
      - index.html
      - how-it-works.html
      - shared.css
      - shared-critical.css
      - premium-showcase.css
      - brand-sync.css
      - report-viewer.css
      - report-viewer.js
      - workflow.css
      - workflow.js
      - images/workflow/**
      - scripts/website-review.test.mjs
      - images/reports/**
      - .github/workflows/publish-example-reports.yml
      - .github/workflows/website-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/website-review.test.mjs
      - run: npm install --no-save playwright lighthouse
      - run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile pages
        run: |
          python3 -m http.server 8080 >/tmp/scopesnap-http.log 2>&1 &
          sleep 2
          mkdir -p qa-screenshots
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const [path,width,height,name] of [
            ['/',1440,900,'home-desktop'],
            ['/',375,812,'home-mobile'],
            ['/',1280,800,'home-desktop-1280'],
            ['/',390,844,'home-mobile-390'],
            ['/how-it-works.html',1440,900,'workflow-desktop'],
          ]) {
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8080'+path,{waitUntil:'networkidle'});
            await page.evaluate(() => { for(const img of document.images) img.loading='eager'; });
            await page.waitForTimeout(1800);
            if(path==='/'){
              await page.waitForFunction(()=>document.querySelector('#rv')?.classList.contains('rv-loaded'),null,{timeout:15000});
              await page.locator('#rv').scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>{
                const img=document.querySelector('#rv #rv-page');
                return !!img && img.complete && img.naturalWidth>=1200;
              },null,{timeout:18000});
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.waitForTimeout(250);
            }
            await page.screenshot({path:'qa-screenshots/'+name+'.png',fullPage:true});
            const missing=await page.evaluate(()=>[...document.images].filter(img=>img.hasAttribute('src')&&!img.naturalWidth).map(img=>img.src));
            if(missing.length) throw new Error('Missing images: '+missing.join(', '));
            if(path==='/'){
              const geometry=await page.evaluate(()=>({
                viewport:innerWidth,
                scroll:document.documentElement.scrollWidth,
                phone:document.querySelector('.so-hero-phone')?.getBoundingClientRect().width,
                hero:document.querySelector('.so-hero')?.getBoundingClientRect().height,
                giantReport:!!document.querySelector('.hero-report-peek')
              }));
              if(geometry.giantReport) throw new Error('Full report must not appear in the hero');
              const proof=await page.evaluate(()=>{
                const hero=document.querySelector('.so-hero')?.getBoundingClientRect();
                const origin=document.querySelector('.so-origin')?.getBoundingClientRect();
                const proofCopy=document.querySelector('.so-origin-inner p')?.textContent.trim();
                const steps=document.querySelector('.so-workflow .so-section-head')?.getBoundingClientRect();
                return {statusBar:!!document.querySelector('.so-specbar'),heroBottom:hero?.bottom,
                  proofTop:origin?.top,proofHeight:origin?.height,proofCopy,stepsTop:steps?.top,
                  legacyLabels:document.querySelectorAll('.so-origin-index,.so-origin-mark').length};
              });
              if(proof.statusBar||proof.legacyLabels||!proof.proofCopy?.includes('Built by builders, for builders.')||
                 !proof.proofCopy?.includes('Tested on real site inspections and quoting jobs.')||
                 Math.abs(proof.proofTop-proof.heroBottom)>2||proof.proofHeight>95){
                throw new Error('The builder proof should be one slim strip immediately below hero: '+JSON.stringify(proof));
              }
              if(width>=900 && proof.stepsTop-proof.proofTop>200)
                throw new Error('Workflow section should sit close to the hero: '+JSON.stringify(proof));

              if(geometry.scroll>geometry.viewport+2) throw new Error('Horizontal page overflow: '+JSON.stringify(geometry));
              if(!geometry.phone || geometry.phone>(width<=650?195:width<=800?206:255)) throw new Error('Hero phone should be slightly larger without taking over kitchen background: '+JSON.stringify(geometry));

              const heroContent=await page.locator('.so-hero-phone').evaluate(el=>{
                const image=el.querySelector('img');
                const clock=el.querySelector('#so-voice-clock');
                const screen=image?.getBoundingClientRect();
                const bounds=el.getBoundingClientRect();
                const hero=el.closest('.so-hero')?.getBoundingClientRect();
                return {src:image?.getAttribute('src'),width:image?.naturalWidth,height:image?.naturalHeight,
                  photos:!!clock&&!!el.querySelector('.so-live-waveform'),
                  croppedByHero:bounds.bottom>el.closest('.so-hero').getBoundingClientRect().bottom+8,
                  startsAboveHeroEnd:!!hero && bounds.top<hero.bottom-130,
                  imageWidth:screen?.width};
              });
              if(!heroContent.src?.includes('/images/perf/hero-phone.webp?v=20261012fast1') || heroContent.width!==1170 || heroContent.height!==2532 || !heroContent.photos)
                throw new Error('Must show the genuine Kitchen RoomDetail image with live voice overlays: '+JSON.stringify(heroContent));
              if(!heroContent.croppedByHero || !heroContent.startsAboveHeroEnd)throw new Error('Phone should show live recording but naturally disappear below the hero edge: '+JSON.stringify(heroContent));

              if(width<=650){
                const captionRoom=await page.evaluate(()=>{
                  const label=document.querySelector('.so-job-types')?.getBoundingClientRect();
                  const phone=document.querySelector('.so-hero-phone')?.getBoundingClientRect();
                  return {labelBottom:label?.bottom,phoneTop:phone?.top,
                    overlap:!!label&&!!phone&&label.bottom>phone.top&&label.right>phone.left};
                });
                if(captionRoom.overlap)throw new Error('Supported-job caption must not be hidden by phone: '+JSON.stringify(captionRoom));
              }

              const clockBefore=await page.locator('#so-voice-clock').textContent();
              await page.waitForTimeout(1300);
              const clockAfter=await page.locator('#so-voice-clock').textContent();
              if(clockBefore===clockAfter)throw new Error('Hero voice timer must count down within the actual screenshot (not cover another timer)');
              const blocked=await page.evaluate(async()=>Promise.all(['/sample-client-report.pdf','/sample-internal-report.pdf','/sample-report.pdf'].map(async path=>({
                path,status:(await fetch(path,{cache:'no-store'})).status
              }))));
              if(blocked.some(result=>result.status!==404))throw new Error('Full report downloads still publicly accessible: '+JSON.stringify(blocked));
              await page.waitForFunction(()=>document.querySelector('#rv')?.classList.contains('rv-loaded'),{timeout:12000});
              const manifest=await page.evaluate(()=>fetch('/images/reports/manifest.json').then(r=>r.json()));
              if(manifest.client.pages!==4||manifest.internal.pages!==5||manifest.client.files.length!==4||manifest.internal.files.length!==5)
                throw new Error('Approved complete report sets were not deployed: '+JSON.stringify(manifest));
              const visibleReport=await page.locator('#rv #rv-page').evaluate(img=>({loaded:img.complete,width:img.naturalWidth,height:img.naturalHeight,url:img.src}));
              if(!visibleReport.loaded||visibleReport.width<1200||visibleReport.height<1800||!visibleReport.url.includes('/images/reports/client-01.webp'))
                throw new Error('Only one full resolution real client report page may be visible at a time: '+JSON.stringify(visibleReport));
              if(await page.locator('#rv .rv-set, #rv .rv-track').count())throw new Error('Old vertical stacked scrolling report markup remains');
              const reportTabLayout=await page.evaluate(()=>{
                const panel=document.querySelector('.so-report-side');
                const tabs=document.querySelector('.rv-switcher');
                const choices=tabs?.getBoundingClientRect();
                const viewer=document.querySelector('#rv')?.getBoundingClientRect();
                const texts=[...document.querySelectorAll('.so-report-option .rv-switch-description')].map(el=>el.textContent.trim());
                return {insideRightPanel:!!panel?.contains(tabs),
                  desktopRight:choices.left>=viewer.right-3,
                  mobileAbove:choices.bottom<viewer.top-3,
                  readable:tabs?.textContent.includes('CHOOSE A REPORT')&&tabs?.textContent.includes('VIEW INTERNAL REPORT'),
                  bothDescriptions:texts.length===2&&texts.every(x=>x.length>60),
                  selected:[...document.querySelectorAll('.so-report-option')].filter(x=>x.getAttribute('aria-selected')==='true').length};
              });
              if(!reportTabLayout.insideRightPanel||!reportTabLayout.readable||!reportTabLayout.bothDescriptions||reportTabLayout.selected!==1||
                 (width>950&&!reportTabLayout.desktopRight)||(width<=950&&!reportTabLayout.mobileAbove))
                throw new Error('Both report descriptions should be available in right column on desktop, above viewer on mobile: '+JSON.stringify(reportTabLayout));
              const unsafeLinks=await page.locator('a[href*=".pdf"]').count();
              if(unsafeLinks)throw new Error('No website report PDF download links allowed');
              if(width<=650){
                const layout=await page.evaluate(()=>({
                  stages:document.querySelectorAll('#features .wf-step').length,
                  mobileFrame:getComputedStyle(document.querySelector('#features .wf-mobile-phone')).display,
                  frameWidth:document.querySelector('#features .wf-mobile-phone')?.getBoundingClientRect().width,
                  mobileReportButtons:document.querySelectorAll('#features .wf-mobile-report [data-wf-type]').length,
                  oldSwipe:document.querySelectorAll('#features .so-steps,#features .so-workflow-swipe').length
                }));
                if(layout.stages!==5||layout.mobileFrame==='none'||layout.frameWidth<250||
                   layout.mobileReportButtons!==2||layout.oldSwipe)
                  throw new Error('Five real-screen workflow stages must stack on mobile: '+JSON.stringify(layout));
                const tabs=await page.locator('.so-report-option').count();
                if(tabs!==2)throw new Error('Expected exactly two compact report preview tabs');
                const swipeHint=await page.locator('.rv-swipe-hint').isVisible();
                if(!swipeHint)throw new Error('Mobile must explicitly say the pages are swipeable');
                await page.emulateMedia({reducedMotion:'reduce'});
                await page.locator('#rv').evaluate(el=>{
                  const bounds=el.getBoundingClientRect(),y=bounds.y+bounds.height/2;
                  el.dispatchEvent(new PointerEvent('pointerdown',{pointerType:'touch',clientX:bounds.x+230,clientY:y,bubbles:true}));
                  el.dispatchEvent(new PointerEvent('pointerup',{pointerType:'touch',clientX:bounds.x+70,clientY:y,bubbles:true}));
                });
                await page.waitForFunction(()=>document.querySelector('#rv-current')?.textContent==='PAGE 2 OF 4');
                if(!await page.locator('#rv #rv-page').getAttribute('src')?.then(src=>src.includes('client-02.webp')))
                  throw new Error('Mobile swipe must actually change to the next genuine report page');
                await page.locator('#rv-prev').click();
                await page.waitForFunction(()=>document.querySelector('#rv-current')?.textContent==='PAGE 1 OF 4');
                await page.emulateMedia({reducedMotion:'no-preference'});
              }


              const fontStatus = await page.evaluate(() => ({available:document.fonts.check('800 22px Archivo'),heading:getComputedStyle(document.querySelector('.so-hero h1')).fontFamily}));
              console.log('Typography',fontStatus);
              if(width>=900) {
                const dimensionQA=await page.evaluate(() => ({
                  labels:[...document.querySelectorAll('.so-ar-label')].map(el=>({
                    value:el.textContent.trim(),width:el.getBBox().width,fill:getComputedStyle(el).fill
                  })),
                  lines:[...document.querySelectorAll('.so-ar-line')].map(el=>getComputedStyle(el).stroke),
                  points:[...document.querySelectorAll('.so-ar-point')].map(el=>({
                    fill:getComputedStyle(el).fill,shape:el.tagName.toLowerCase()
                  })),
                  strayWitnesses:document.querySelectorAll('.so-window-witness,.so-window-tick').length
                }));
                console.log('Window AR measurement QA',dimensionQA);
                if(dimensionQA.labels.length!==2 || dimensionQA.labels.some(v=>v.width<40 || v.fill!=='rgb(255, 255, 255)'))
                  throw new Error('Actual AR measurement text not rendered: '+JSON.stringify(dimensionQA));
                if(dimensionQA.lines.length!==2 || dimensionQA.lines.some(v=>v!=='rgb(242, 214, 143)'))
                  throw new Error('Tape lines must use actual in-app gold: '+JSON.stringify(dimensionQA));
                if(dimensionQA.points.length!==4 || dimensionQA.points.some(v=>v.shape!=='circle' || v.fill!=='rgb(242, 214, 143)') || dimensionQA.strayWitnesses)
                  throw new Error('Measurement endpoints must be small gold circles; no drafting ticks: '+JSON.stringify(dimensionQA));
              }

              if(width>=900 && geometry.hero>1050) throw new Error('Desktop hero too tall: '+JSON.stringify(geometry));
              const before=await page.locator('details.so-savings-disclosure').evaluate(el=>el.open);
              if(before) throw new Error('Calculator must be collapsed initially');
              if(width>1300){
                const phoneWidth=await page.locator('#features .wf-phone').evaluate(el=>el.getBoundingClientRect().width);
                if(phoneWidth<250 || phoneWidth>310) throw new Error('Sticky desktop phone must be readable: '+phoneWidth);
                await page.waitForFunction(()=>document.querySelector('#rv')?.classList.contains('rv-loaded'),{timeout:12000});
                const clientCaption=await page.locator('#rv-caption').innerText();
                if(!clientCaption.includes('4 PAGES')) throw new Error('Full four-page client report not loaded');
                if((await page.locator('#rv-current').textContent())!=='PAGE 1 OF 4')throw new Error('Client should start on cover');
                await page.locator('#rv-next').click();
                await page.waitForFunction(()=>document.querySelector('#rv-current')?.textContent==='PAGE 2 OF 4');
                if(!await page.locator('#rv #rv-page').evaluate(img=>img.src.includes('client-02.webp')&&img.naturalWidth>0))
                  throw new Error('Next must show full actual client kitchen report page');
                await page.locator('#rv-prev').click();
                await page.waitForFunction(()=>document.querySelector('#rv-current')?.textContent==='PAGE 1 OF 4');
                await page.locator('.so-report-option[data-name="internal"]').click();
                await page.waitForFunction(()=>document.querySelector('#rv-caption')?.textContent.includes('INTERNAL REPORT'));
                if((await page.locator('#rv-current').textContent())!=='PAGE 1 OF 5')throw new Error('Internal tab must reset to its cover');
                if(!await page.locator('#rv #rv-page').evaluate(img=>img.src.includes('internal-01.webp')))
                  throw new Error('Switch must show full internal report cover');
                await page.locator('#rv').hover();
                await page.waitForTimeout(5700);
                if((await page.locator('#rv-current').textContent())!=='PAGE 1 OF 5')
                  throw new Error('Hover should pause automatic page advance');
                await page.mouse.move(5,5);
                await page.locator('.so-report-option[data-name="client"]').click();
                await page.locator('#rv').scrollIntoViewIfNeeded();
                await page.mouse.move(5,5);
                await page.waitForFunction(()=>document.querySelector('#rv-current')?.textContent==='PAGE 2 OF 4',null,{timeout:9000});
                if((await page.locator('.so-report-option[aria-selected="true"]').getAttribute('data-name'))!=='client')
                  throw new Error('Auto advancing pages must not automatically change report type');
                await page.locator('details.so-savings-disclosure > summary').click();
                const opened=await page.locator('details.so-savings-disclosure').evaluate(el=>el.open);
                if(!opened) throw new Error('Savings toggle broken');
                const moneyColor=await page.locator('#roiMoney').evaluate(el=>getComputedStyle(el).color);
                if(moneyColor!=='rgb(14, 14, 13)')throw new Error('Calculator number must be ink, got: '+moneyColor);
                await page.locator('#toggleAnnual').click();
                const annual=await page.locator('#pro-price').textContent();
                if(!annual.includes('$1,309'))throw new Error('Annual billing toggle broken');
              }

            }
            if(path==='/' && width===1440){
              for(let n=1;n<=5;n++){
                await page.evaluate(stage=>{
                  const el=document.querySelector('#features .wf-step[data-step="'+stage+'"]');
                  const r=el.getBoundingClientRect();
                  window.scrollTo({top:window.scrollY+r.top+r.height/2-window.innerHeight/2,behavior:'instant'});
                },n);
                await page.waitForFunction(stage=>document.querySelector('#features .wf-screen[data-step="'+stage+'"]')?.classList.contains('is-active'),n,{timeout:7000});
                await page.waitForTimeout(320);
                const frame=await page.locator('#features .wf-phone').boundingBox();
                if(!frame||frame.y<0||frame.y+frame.height>height) throw new Error('Workflow phone clipped in stage '+n+': '+JSON.stringify(frame));
                if(n===5){
                  const reportPage=await page.locator('#features .wf-report .wf-pages').boundingBox();
                  const phone=await page.locator('#features .wf-phone').boundingBox();
                  if(!reportPage || !phone || reportPage.width<419 ||
                     reportPage.x<phone.x+phone.width+10 || reportPage.x+reportPage.width>width ||
                     reportPage.y<0 || reportPage.y+reportPage.height>height){
                    throw new Error('The complete 420px report page must sit beside the phone: '+JSON.stringify({reportPage,phone,viewport:{width,height}}));
                  }
                }
                await page.screenshot({path:'qa-screenshots/wf-stage-0'+n+'-desktop.png',fullPage:false});
              }
              await page.locator('#features .wf-report [data-wf-type="internal"]').click();
              if((await page.locator('#features .wf-report [data-wf-type="internal"]').getAttribute('aria-pressed'))!=='true')
                throw new Error('Internal report switch is not functional');
              await page.waitForFunction(()=>{const image=document.querySelector('#features .wf-report .wf-page.internal');return image?.complete&&image?.naturalWidth>1200;},{timeout:10000});
              await page.waitForTimeout(350);
              await page.evaluate(()=>{
                const el=document.querySelector('#features .wf-step[data-step="5"]');
                const rect=el.getBoundingClientRect();
                window.scrollTo({top:window.scrollY+rect.top+rect.height/2-innerHeight/2,behavior:'instant'});
              });
              await page.waitForTimeout(250);
              await page.screenshot({path:'qa-screenshots/wf-stage-05-internal-desktop.png',fullPage:false});
            }
            if(path==='/' && width===390){
              for(let n=1;n<=5;n++){
                await page.evaluate(stage=>{
                  const el=document.querySelector('#features .wf-step[data-step="'+stage+'"]');
                  const r=el.getBoundingClientRect();
                  window.scrollTo({top:window.scrollY+r.top-20,behavior:'instant'});
                },n);
                await page.waitForTimeout(200);
                await page.screenshot({path:'qa-screenshots/wf-stage-0'+n+'-mobile.png',fullPage:false});
              }
              await page.locator('#features .wf-mobile-report [data-wf-type="internal"]').click();
              if((await page.locator('#features .wf-mobile-report [data-wf-type="internal"]').getAttribute('aria-pressed'))!=='true')
                throw new Error('Mobile report switch is not functional');
            }
            await page.close();
          }
          await browser.close();
          JS
      - name: Make lightweight inspectable screenshots
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ("home-desktop", "home-mobile", "home-desktop-1280", "home-mobile-390", "workflow-desktop"):
              src=Path("qa-screenshots") / f"{name}.png"
              im=Image.open(src).convert("RGB")
              im.thumbnail((1000,13000),Image.Resampling.LANCZOS)
              im.save(Path("qa-screenshots") / f"{name}-review.jpg",quality=66,optimize=True)
          PY
      - name: Publish QA snapshots to isolated branch
        run: |
          git config user.name "ScopeSnap visual QA bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f qa-screenshots/
          git commit -m "Generated desktop/mobile visual QA snapshots" -- qa-screenshots/
          git push -f origin HEAD:refs/heads/website-visual-qa-snapshots
      - name: Lighthouse mobile performance and accessibility
        run: |
          npx lighthouse http://127.0.0.1:8080/ --only-categories=performance,accessibility --chrome-flags="--headless --no-sandbox" --output=json --output-path=qa-screenshots/lighthouse.json --quiet
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const categories=JSON.parse(readFileSync('qa-screenshots/lighthouse.json','utf8')).categories;
          const performance=Math.round(categories.performance.score*100);
          const accessibility=Math.round(categories.accessibility.score*100);
          const report=JSON.parse(readFileSync('qa-screenshots/lighthouse.json','utf8'));
          console.log('Lighthouse mobile:',{performance,accessibility});
          const keys=['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','render-blocking-resources','unused-css-rules','unused-javascript','modern-image-formats','uses-optimized-images','uses-responsive-images','network-requests','total-byte-weight','font-display','lcp-discovery-insight','lcp-request-discovery','network-dependency-tree-insight','image-delivery-insight'];
          for(const key of keys){
            const audit=report.audits[key]; if(!audit) continue;
            console.log('AUDIT',key,'score',audit.score,'value',audit.displayValue||audit.numericValue||'',
              'wasted',audit.details?.overallSavingsMs||audit.details?.overallSavingsBytes||audit.details?.items?.slice(0,6).map(item=>({url:item.url,totalBytes:item.totalBytes,wastedBytes:item.wastedBytes,wastedMs:item.wastedMs})));
          }
          if(performance<85||accessibility<95) throw Error('Lighthouse thresholds unmet: performance>=85, accessibility>=95');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-visual-qa
          path: |
            qa-screenshots/*.png
            qa-screenshots/lighthouse.json
          retention-days: 7
