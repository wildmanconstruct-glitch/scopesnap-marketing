name: Website visual QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - how-it-works.html
      - shared.css
      - premium-showcase.css
      - .github/workflows/website-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile pages
        run: |
          python3 -m http.server 8080 >/tmp/scopesnap-http.log 2>&1 &
          sleep 2
          mkdir -p qa-screenshots
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const [path,width,height,name] of [
            ['/',1440,900,'home-desktop'],
            ['/',390,844,'home-mobile'],
            ['/how-it-works.html',1440,900,'workflow-desktop'],
          ]) {
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8080'+path,{waitUntil:'networkidle'});
            await page.evaluate(() => { for(const img of document.images) img.loading='eager'; });
            await page.waitForTimeout(1800);
            await page.screenshot({path:'qa-screenshots/'+name+'.png',fullPage:true});
            const missing=await page.evaluate(()=>[...document.images].filter(img=>!img.naturalWidth).map(img=>img.src));
            if(missing.length) throw new Error('Missing images: '+missing.join(', '));
            if(path==='/'){
              const geometry=await page.evaluate(()=>({
                viewport:innerWidth,
                scroll:document.documentElement.scrollWidth,
                phone:document.querySelector('.hero-room-device')?.getBoundingClientRect().width,
                hero:document.querySelector('.hero')?.getBoundingClientRect().height,
                giantReport:!!document.querySelector('.hero-report-peek')
              }));
              if(geometry.giantReport) throw new Error('Full report must not appear in the hero');
              if(geometry.scroll>geometry.viewport+2) throw new Error('Horizontal page overflow: '+JSON.stringify(geometry));
              if(!geometry.phone || geometry.phone>300) throw new Error('Hero phone must remain contained: '+JSON.stringify(geometry));
              if(width>=900 && geometry.hero>850) throw new Error('Desktop hero too tall: '+JSON.stringify(geometry));
            }
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: website-visual-qa
          path: qa-screenshots/*.png
          retention-days: 7
