name: Verify premium website and reports
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'how-it-works.html'
      - 'premium-showcase.css'
      - 'brand-sync.css'
      - 'scripts/website-review.test.mjs'
      - 'images/**'
      - 'sample-client-report.pdf'
      - 'sample-internal-report.pdf'
      - '.github/workflows/publish-example-reports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-assets-and-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check website claims and SEO
        run: node scripts/website-review.test.mjs
      - name: Verify marketing assets and document links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path('index.html').read_text(encoding='utf-8')
          css = Path('brand-sync.css').read_text(encoding='utf-8')
          guide = Path('how-it-works.html').read_text(encoding='utf-8')
          assert 'class="so-hero"' in home and 'class="so-report-layout"' in home
          assert '.so-hero' in css and 'scroll-snap-type:x mandatory' in css
          assert '/brand-sync.css?v=20261010setout1' in home
          for name in ('screen-planscan','screen-voice','screen-measure','screen-photo','screen-room'):
              path = Path(f'images/{name}.jpg')
              assert path.is_file() and path.stat().st_size > 30000, path
              assert f'/images/{name}.jpg' in home, name
          for doc in ('client','internal'):
              pdf=Path(f'sample-{doc}-report.pdf')
              assert pdf.is_file() and pdf.stat().st_size > 300000, pdf
              assert f'/sample-{doc}-report.pdf' in home
              picture = Path(f'images/report-{doc}-detail.jpg')
              assert picture.is_file() and picture.stat().st_size > 30000, picture
              assert f'/images/report-{doc}-detail.jpg' in home
          for room in ('kitchen','bathroom','living','exterior'):
              p=Path(f'images/demo/{room}.jpg')
              assert p.is_file() and p.stat().st_size > 20000, p
          assert '/images/screen-measure.jpg' in guide
          print('Site Set-Out app screenshots, product features and real report assets verified')
          PY
      - name: Inspect full-length photo reports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          test "$(pdfinfo sample-client-report.pdf | awk '/^Pages:/ {print $2}')" -ge 4
          test "$(pdfinfo sample-internal-report.pdf | awk '/^Pages:/ {print $2}')" -ge 4
          test "$(pdfimages -list sample-client-report.pdf | awk 'NR > 2 {n++} END {print n+0}')" -ge 6
          test "$(pdfimages -list sample-internal-report.pdf | awk 'NR > 2 {n++} END {print n+0}')" -ge 6
          pdfinfo sample-client-report.pdf | grep -qi 'jspdf'
          pdfinfo sample-internal-report.pdf | grep -qi 'jspdf'
          echo 'Both authentic app-generated photo reports verified'