name: Publish example reports
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_sample_reports.py'
      - '.github/workflows/publish-example-reports.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection and rendering tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate both PDFs
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python scripts/build_sample_reports.py
          pdfinfo sample-client-report.pdf | grep Pages
          pdfinfo sample-internal-report.pdf | grep Pages
          pdftotext sample-client-report.pdf - | grep -q 'Whole house'
          pdftotext sample-internal-report.pdf - | grep -q 'Approximate estimating quantities'
      - name: Render PDF cover previews
        run: |
          pdftoppm -f 1 -l 1 -singlefile -scale-to 1200 -jpeg -jpegopt quality=86 sample-client-report.pdf images/sample-client-cover
          pdftoppm -f 1 -l 1 -singlefile -scale-to 1200 -jpeg -jpegopt quality=86 sample-internal-report.pdf images/sample-internal-cover
      - name: Commit refreshed samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample-client-report.pdf sample-internal-report.pdf images/sample-client-cover.jpg images/sample-internal-cover.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated client and internal report examples"
            git push
          fi
