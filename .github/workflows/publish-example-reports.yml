name: Verify marketing website and report previews
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'how-it-works.html'
      - 'premium-showcase.css'
      - 'brand-sync.css'
      - 'scripts/website-review.test.mjs'
      - 'images/**'
      - 'report-viewer.css'
      - 'report-viewer.js'
      - 'sample-client-report.pdf'
      - 'sample-internal-report.pdf'
      - '.github/workflows/publish-example-reports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify marketing UI, pricing, navigation and no full report downloads
        run: node scripts/website-review.test.mjs
      - name: Verify authentic app previews with NO public report PDF files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home=Path('index.html').read_text(encoding='utf-8')
          guide=Path('how-it-works.html').read_text(encoding='utf-8')
          # Workflow now uses five screenshots from actual app components and
          # the existing branded PDF-export pipeline, not the old four-card carousel.
          for name in ('screen-hero','screen-planscan','screen-voice','screen-measure','screen-photo'):
              p=Path(f'images/{name}.jpg')
              assert p.is_file() and p.stat().st_size > 30000, p
          assert '/images/perf/hero-phone.webp' in home
          assert Path('images/perf/hero-phone.webp').stat().st_size > 30000
          for name in ('wf-01-start','wf-02-capture','wf-03-questions','wf-04-review','wf-05-report','wf-05-client-page','wf-05-internal-page'):
              p=Path(f'images/workflow/{name}.webp')
              assert p.is_file() and p.stat().st_size > 30000, p
              assert f'/images/workflow/{name}.webp' in home, name
          from re import findall
          assert len(findall(r'class="wf-step(?: is-active)?"',home)) == 5, 'Expected exactly five workflow steps'
          assert 'Quick Create' in home and 'Full Setup' in home and 'Scope Check' in home
          for name in ('client','internal'):
              p=Path(f'sample-{name}-report.pdf')
              assert not p.exists(), f'Public downloadable report must not exist: {p}'
              preview=Path('images/report-'+name+('-photos.jpg' if name=='client' else '-detail.jpg'))
              assert preview.exists() and preview.stat().st_size>30000
          assert 'data-pdf=' not in home
          assert 'id="rv"' in home and 'report-viewer.js' in home
          assert '/sample-client-report.pdf' not in home+guide
          assert '/sample-internal-report.pdf' not in home+guide
          from json import loads
          manifest=loads(Path('images/reports/manifest.json').read_text(encoding='utf8'))
          assert manifest['client']['pages']==4 and manifest['internal']['pages']==5
          assert manifest['builderBrand']['name']=='Banksia Park Build Co' and manifest['builderBrand']['logoOnEveryPage']
          assert manifest['version']=='07d15aeca14664790b99ffc72f1481b453fd5b64'
          for kind in ('client','internal'):
              files=manifest[kind]['files']
              assert len(files)==manifest[kind]['pages']
              assert all((Path('images/reports')/name).is_file() for name in files)
              assert sum((Path('images/reports')/name).stat().st_size for name in files)<2500000
          assert not list(Path('.').rglob('*.pdf'))
          print('Approved 4-page client and 5-page internal real-export report images; no public PDF binaries')
          PY
